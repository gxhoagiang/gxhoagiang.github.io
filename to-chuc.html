    <style>
      :root {
        --navy-blue: #1a2b4c;
        --gold-accent: #c59b27;
      }

      /* Căn giữa toàn bộ vùng main */
      .update-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        padding: 40px 15px;
      }

      /* Khung Thông Báo Cập Nhật */
      .updating-card {
        background-color: #ffffff;
        border-top: 4px solid var(--gold-accent);
        border-radius: 12px;
        padding: 45px 30px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        max-width: 550px;
        width: 100%;

        /* Căn giữa tuyệt đối nội dung */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center !important;
      }

      /* Hiệu ứng biểu tượng bánh răng xoay */
      .icon-wrapper {
        position: relative;
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
      }

      .updating-icon {
        font-size: 3.8rem;
        display: inline-block;
        animation: spin 6s infinite linear;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .updating-card h3 {
        color: var(--navy-blue);
        font-size: 1.4rem;
        margin-bottom: 12px;
        font-weight: 700;
        font-family: "Playfair Display", serif;
        text-align: center !important;
        width: 100%;
      }

      .updating-card p {
        color: #555555;
        font-size: 0.98rem;
        line-height: 1.6;
        margin: 0 auto 10px auto;
        font-family: "Inter", sans-serif;
        text-align: center !important;
        width: 100%;
      }

      .updating-sub {
        font-style: italic;
        color: #888888 !important;
        font-size: 0.9rem !important;
        margin-bottom: 28px !important;
        text-align: center !important;
      }

      /* Nút Quay Về Trang Chủ */
      .btn-home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 28px;
        background-color: var(--navy-blue);
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 30px;
        font-weight: 600;
        font-size: 0.92rem;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(26, 43, 76, 0.15);
        font-family: "Inter", sans-serif;
      }

      .btn-home:hover {
        background-color: var(--gold-accent);
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(197, 155, 39, 0.3);
      }
    </style>
  </head>
  <body>
    <!-- Header tự động nhúng qua JS -->
    <header id="header-placeholder"></header>

    <main class="container update-wrapper">
      <div class="updating-card">
        <div class="icon-wrapper">
          <span class="updating-icon">⚙️</span>
        </div>
        <h3>Hệ Thống Đang Nâng Cấp</h3>
        <p>
          Trang <strong>Cơ Cấu Tổ Chức & Ban Ngành</strong> đang trong quá trình
          hoàn thiện dữ liệu và hình ảnh nhân sự.
        </p>
        <p class="updating-sub">Xin quý cộng đoàn vui lòng quay lại sau!</p>
        <a href="index.html" class="btn-home">⬅ Trở về Trang Chủ</a>
      </div>
    </main>

    <!-- Footer tự động nhúng qua JS -->
    <footer id="footer-placeholder"></footer>

    <script src="js/script.js" defer></script>
  </body>
