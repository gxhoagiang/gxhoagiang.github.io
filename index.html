<!doctype html>

    <meta charset="UTF-8" />

    <!-- 2. Tiêu đề và Mô tả SEO cho Google -->
    <title>Giáo Xứ Hòa Giang - Xứ Đoàn Phê-rô Đoàn Công Quý</title>
    <meta
      name="description"
      content="Trang thông tin chính thức của Giáo Xứ Hòa Giang. Cập nhật lịch phụng vụ, giờ lễ Chúa nhật, ngày thường và các tin tức sự kiện mới nhất."
    />
    <link rel="canonical" href="https://gxhoagiang.github.io/" />

    <!-- 3. Open Graph Tags (Hiển thị xem trước trên Zalo, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gxhoagiang.github.io/" />
    <meta property="og:site_name" content="Giáo Xứ Hòa Giang" />
    <meta
      property="og:title"
      content="Giáo Xứ Hòa Giang - Xứ Đoàn Phê-rô Đoàn Công Quý"
    />

      property="og:description"
      content="Trang thông tin chính thức của Giáo Xứ Hòa Giang. Cập nhật lịch phụng vụ, giờ lễ Chúa nhật, ngày thường và các tin tức, sự kiện mới nhất."
    />
    <meta
      property="og:image"
      content="https://gxhoagiang.github.io/img/logo.png"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://gxhoagiang.github.io/#website",
            "url": "https://gxhoagiang.github.io/",
            "name": "Giáo Xứ Hòa Giang",
            "alternateName": "Xứ Đoàn Phê-rô Đoàn Công Quý"

          {
            "@type": "Church",
            "@id": "https://gxhoagiang.github.io/#church",
            "name": "Giáo Xứ Hòa Giang",
            "alternateName": "Xứ Đoàn Phê-rô Đoàn Công Quý",
            "url": "https://gxhoagiang.github.io/",
            "logo": "https://gxhoagiang.github.io/img/logo.png",
            "image": "https://gxhoagiang.github.io/img/logo.png",
            "description": "Trang thông tin chính thức của Giáo Xứ Hòa Giang."
          }
        ]
